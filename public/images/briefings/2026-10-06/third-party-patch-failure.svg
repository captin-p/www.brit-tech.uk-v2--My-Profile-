<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Third-party patch failure</title><desc id="desc">A security patch stops at a supplier boundary while protected records remain exposed.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#12324a"/></linearGradient></defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/><path d="M90 315h310" stroke="#46d6c7" stroke-width="18"/><path d="m370 280 55 35-55 35" fill="none" stroke="#46d6c7" stroke-width="18"/>
  <rect x="445" y="105" width="18" height="420" rx="9" fill="#ff6b6b"/><text x="475" y="92" fill="#ffb1b1" font-family="sans-serif" font-size="26">THIRD-PARTY BOUNDARY</text>
  <g fill="#dbeafe"><rect x="560" y="175" width="470" height="280" rx="28" fill="#0b2437" stroke="#6ea8c9" stroke-width="4"/><path d="M650 235h290M650 300h290M650 365h210" stroke="#b9dcf0" stroke-width="18" stroke-linecap="round"/></g>
  <circle cx="445" cy="315" r="45" fill="#ff6b6b"/><path d="M425 295l40 40m0-40-40 40" stroke="white" stroke-width="12" stroke-linecap="round"/>
  <text x="90" y="565" fill="white" font-family="sans-serif" font-size="38" font-weight="700">PATCH OWNERSHIP NEEDS EVIDENCE</text>
</svg>
