<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">AI-server backlog meets delivery limits</title>
<desc id="desc">Large AI orders wait on memory, power, cooling and network-fabric readiness before becoming usable capacity.</desc>
<defs><radialGradient id="bg" cx="50%" cy="35%" r="85%"><stop offset="0%" stop-color="#173252"/><stop offset="100%" stop-color="#06101d"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<path d="M80 145H1120" stroke="#284865" stroke-width="2"/>
<text x="80" y="94" fill="#fff" font-family="Arial, sans-serif" font-size="40" font-weight="700">AI-server backlog meets delivery limits</text>
<rect x="120" y="205" width="360" height="245" rx="24" fill="#0d2135" stroke="#355b78" stroke-width="2"/>
<rect x="720" y="205" width="360" height="245" rx="24" fill="#0d2135" stroke="#355b78" stroke-width="2"/>
<text x="160" y="255" fill="#60a5fa" font-family="Arial, sans-serif" font-size="25" font-weight="700">RECORD DEMAND</text>
<text x="160" y="310" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">$132.3B backlog</text>
<text x="160" y="348" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">$60.2B new orders</text>
<text x="160" y="386" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">$22B quarterly revenue</text>
<text x="760" y="255" fill="#60a5fa" font-family="Arial, sans-serif" font-size="25" font-weight="700">DELIVERY GATES</text>
<text x="760" y="310" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">Memory allocation</text>
<text x="760" y="348" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">Rack power + cooling</text>
<text x="760" y="386" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">Fabric readiness</text>
<path d="M490 327H690" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
<circle cx="590" cy="327" r="34" fill="#0d2135" stroke="#60a5fa" stroke-width="6"/>
