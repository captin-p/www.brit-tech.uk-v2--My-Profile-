<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Xen Orchestra authentication bypass</title><desc id="desc">A malicious authentication cookie is blocked before it can reach virtualization management and hosts.</desc><rect width="1200" height="675" fill="#071521"/><rect x="445" y="155" width="310" height="360" rx="34" fill="#102c40" stroke="#55d9bd" stroke-width="8"/><g fill="#79e2ce"><rect x="500" y="220" width="200" height="55" rx="12"/><rect x="500" y="310" width="200" height="55" rx="12"/><rect x="500" y="400" width="200" height="55" rx="12"/></g><path d="M140 335h240" stroke="#ff6b7c" stroke-width="18"/><path d="M330 280l55 55-55 55" fill="none" stroke="#ff6b7c" stroke-width="18"/><rect x="365" y="185" width="34" height="300" rx="17" fill="#ffca66"/><path d="M755 250h150M755 420h150" stroke="#769cb1" stroke-width="9"/><g fill="#b7d8e8"><rect x="905" y="185" width="200" height="130" rx="24"/><rect x="905" y="355" width="200" height="130" rx="24"/></g><text x="260" y="315" text-anchor="middle" fill="#ffc0c8" font-family="monospace" font-size="30">authToken={}</text><text x="600" y="590" text-anchor="middle" fill="#edfaff" font-family="system-ui,sans-serif" font-size="38" font-weight="700">PATCH • ISOLATE • HUNT</text></svg>