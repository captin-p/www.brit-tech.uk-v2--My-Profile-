<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Cloud data loss and independent backup</title><desc id="desc">A damaged data centre loses some records while independent backup locations preserve recoverable copies.</desc><rect width="1200" height="675" fill="#071724"/><g fill="#14364a" stroke="#63d8c1" stroke-width="7"><rect x="95" y="175" width="270" height="315" rx="30"/><rect x="830" y="175" width="270" height="315" rx="30"/></g><g fill="#8ce6d4"><rect x="145" y="235" width="170" height="52" rx="10"/><rect x="145" y="320" width="170" height="52" rx="10"/><rect x="880" y="235" width="170" height="52" rx="10"/><rect x="880" y="320" width="170" height="52" rx="10"/></g><path d="M365 335h150M685 335h145" stroke="#7c9fb3" stroke-width="9"/><path d="M500 280l45 55-45 55M700 280l-45 55 45 55" fill="none" stroke="#7c9fb3" stroke-width="9"/><circle cx="600" cy="335" r="108" fill="#3a2028" stroke="#ff6d77" stroke-width="10"/><path d="M550 285l100 100M650 285L550 385" stroke="#ff6d77" stroke-width="18" stroke-linecap="round"/><text x="600" y="565" text-anchor="middle" fill="#edf9ff" font-family="system-ui,sans-serif" font-size="36" font-weight="700">BACKUPS MUST SURVIVE THE PROVIDER LOCATION</text></svg>