<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI-assisted formal verification</title><desc id="desc">AI agents generate proof artifacts that a deterministic Lean kernel checks before code is accepted.</desc><rect width="1200" height="675" fill="#101426"/><g font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle"><rect x="70" y="210" width="275" height="250" rx="32" fill="#282f55" stroke="#a9a4ff" stroke-width="8"/><text x="207" y="300" fill="#f1efff" font-size="30">AI AGENTS</text><text x="207" y="350" fill="#c8c5ff" font-size="23">generate proofs</text><rect x="460" y="145" width="280" height="380" rx="32" fill="#1b3748" stroke="#58dec1" stroke-width="9"/><text x="600" y="245" fill="#eafff9" font-size="31">LEAN KERNEL</text><path d="M545 340l35 35 78-90" fill="none" stroke="#58dec1" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="445" fill="#aee8dc" font-size="22">machine-checked gate</text><rect x="855" y="210" width="275" height="250" rx="32" fill="#243c45" stroke="#ffca6b" stroke-width="8"/><text x="992" y="300" fill="#fff7e7" font-size="29">COMPILED</text><text x="992" y="342" fill="#fff7e7" font-size="29">CRYPTO CODE</text></g><path d="M345 335h115M740 335h115" stroke="#b9c8da" stroke-width="10"/><text x="600" y="600" text-anchor="middle" fill="#f2f5ff" font-family="system-ui,sans-serif" font-size="36" font-weight="700">UNTRUSTED GENERATION • TRUSTED VERIFICATION</text></svg>