<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Data centre capital allocation across the complete system</title><desc id="desc">A data centre investment stack shows servers, network, power and cooling as linked capacity components.</desc><rect width="1200" height="630" fill="#07111f"/><text x="60" y="78" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="34" font-weight="700">WHOLE-SYSTEM CAPACITY</text><g font-family="system-ui,sans-serif" font-weight="700"><rect x="120" y="160" width="690" height="100" rx="18" fill="#2563eb"/><text x="150" y="224" fill="white" font-size="32">SERVERS</text><rect x="120" y="278" width="420" height="90" rx="18" fill="#0891b2"/><text x="150" y="335" fill="white" font-size="30">NETWORK FABRIC</text><rect x="120" y="386" width="310" height="80" rx="18" fill="#059669"/><text x="150" y="437" fill="white" font-size="27">POWER</text><rect x="448" y="386" width="280" height="80" rx="18" fill="#7c3aed"/><text x="478" y="437" fill="white" font-size="27">COOLING</text></g><circle cx="960" cy="315" r="130" fill="#102a44" stroke="#fbbf24" stroke-width="9"/><text x="960" y="300" text-anchor="middle" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="46" font-weight="800">$2.1T</text><text x="960" y="350" text-anchor="middle" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="27">2028 estimate</text><text x="60" y="570" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="28">Measure useful throughput and recovery per megawatt</text></svg>