<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Geographically separated digital recovery paths</title><desc id="desc">Data centres, power and satellite links maintain recovery paths during combined physical and cyber attacks.</desc><rect width="1200" height="630" fill="#07111f"/><circle cx="970" cy="130" r="52" fill="#1e3a5f" stroke="#7dd3fc" stroke-width="7"/><path d="M930 172L790 292" stroke="#7dd3fc" stroke-width="7" stroke-dasharray="16 14"/><g fill="#102a44" stroke="#38bdf8" stroke-width="7"><rect x="120" y="250" width="260" height="210" rx="20"/><rect x="820" y="300" width="260" height="180" rx="20"/></g><g fill="#7dd3fc"><rect x="158" y="290" width="184" height="26" rx="8"/><rect x="158" y="340" width="184" height="26" rx="8"/><rect x="158" y="390" width="184" height="26" rx="8"/><rect x="858" y="340" width="184" height="26" rx="8"/><rect x="858" y="390" width="184" height="26" rx="8"/></g><path d="M380 350c120-115 280-115 440 35" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round"/><path d="M778 348l42 37-52 22" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round"/><path d="M490 470l55-115 55 115z" fill="#f97316"/><path d="M545 400v34" stroke="#07111f" stroke-width="9" stroke-linecap="round"/><circle cx="545" cy="450" r="6" fill="#07111f"/><text x="60" y="78" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="34" font-weight="700">DIGITAL RESILIENCE UNDER COMPOUND FAILURE</text><text x="60" y="570" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="28">Separate region • alternate network • independent recovery</text></svg>