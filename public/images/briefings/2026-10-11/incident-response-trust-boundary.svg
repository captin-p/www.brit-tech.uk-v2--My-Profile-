<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Incident-response provider trust boundary</title>
  <desc id="desc">An external responder passes conflict screening, scoped access and dual approval before reaching sensitive evidence.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091727"/><stop offset="1" stop-color="#1c2138"/></linearGradient><linearGradient id="gate" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <g transform="translate(80 205)"><circle cx="105" cy="82" r="58" fill="#20354e" stroke="#7dd3fc" stroke-width="5"/><circle cx="105" cy="69" r="23" fill="#7dd3fc"/><path d="M62 129c12-34 74-34 86 0" fill="#7dd3fc"/><rect x="0" y="163" width="210" height="66" rx="25" fill="#11273c" stroke="#7dd3fc" stroke-width="4"/><text x="105" y="205" text-anchor="middle" fill="#dbeafe" font-family="system-ui,sans-serif" font-size="24" font-weight="700">RESPONDER</text></g>
  <path d="M290 318h108" stroke="#64748b" stroke-width="6" stroke-dasharray="13 11"/>
  <g transform="translate(398 110)"><rect width="384" height="410" rx="36" fill="#0d2439" stroke="url(#gate)" stroke-width="6"/><g font-family="system-ui,sans-serif" font-weight="700" font-size="22"><rect x="42" y="42" width="300" height="78" rx="20" fill="#103b48"/><text x="192" y="90" text-anchor="middle" fill="#67e8f9">CONFLICT CHECK</text><rect x="42" y="164" width="300" height="78" rx="20" fill="#1b3150"/><text x="192" y="212" text-anchor="middle" fill="#93c5fd">SCOPED ACCESS</text><rect x="42" y="286" width="300" height="78" rx="20" fill="#332b55"/><text x="192" y="334" text-anchor="middle" fill="#c4b5fd">DUAL APPROVAL</text></g><g fill="#34d399"><path d="M66 75l13 13 25-29" stroke="#34d399" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M66 197l13 13 25-29" stroke="#34d399" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M66 319l13 13 25-29" stroke="#34d399" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <path d="M782 318h92" stroke="#a78bfa" stroke-width="7"/>
  <g transform="translate(874 171)"><path d="M42 88V55c0-58 150-58 150 0v33" fill="none" stroke="#fbbf24" stroke-width="10"/><rect x="0" y="88" width="234" height="224" rx="30" fill="#382e19" stroke="#fbbf24" stroke-width="5"/><circle cx="117" cy="174" r="26" fill="#fde68a"/><path d="M117 195v47" stroke="#fde68a" stroke-width="13" stroke-linecap="round"/><text x="117" y="286" text-anchor="middle" fill="#fef3c7" font-family="system-ui,sans-serif" font-size="23" font-weight="700">EVIDENCE</text></g>
  <text x="63" y="580" fill="#f5f3ff" font-family="system-ui,sans-serif" font-size="34" font-weight="700">External response access is a privileged trust decision</text>
</svg>
