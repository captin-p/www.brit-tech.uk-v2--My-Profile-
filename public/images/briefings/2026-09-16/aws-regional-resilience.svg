<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cloud-region failure and cross-region recovery</title>
  <desc id="desc">An original diagram showing a damaged cloud region isolated from a healthy recovery region.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071a2d"/><stop offset="1" stop-color="#123047"/></linearGradient><linearGradient id="ok"><stop stop-color="#34d399"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="68" y="84" fill="#f8fafc" font-family="Arial, sans-serif" font-size="44" font-weight="700">REGIONAL RESILIENCE</text>
  <text x="68" y="124" fill="#a5f3fc" font-family="Arial, sans-serif" font-size="22">Availability zones do not replace off-region recovery</text>
  <rect x="75" y="180" width="430" height="390" rx="34" fill="#241522" stroke="#fb7185" stroke-width="4"/>
  <rect x="695" y="180" width="430" height="390" rx="34" fill="#0a2b2d" stroke="#34d399" stroke-width="4"/>
  <g font-family="Arial, sans-serif" font-weight="700"><text x="110" y="228" fill="#fda4af" font-size="25">PRIMARY REGION</text><text x="730" y="228" fill="#6ee7b7" font-size="25">RECOVERY REGION</text></g>
  <g fill="#3b1d2b" stroke="#fb7185" stroke-width="3"><rect x="115" y="270" width="100" height="190" rx="14"/><rect x="240" y="270" width="100" height="190" rx="14"/><rect x="365" y="270" width="100" height="190" rx="14"/></g>
  <g fill="#0f3c42" stroke="#5eead4" stroke-width="3"><rect x="735" y="270" width="100" height="190" rx="14"/><rect x="860" y="270" width="100" height="190" rx="14"/><rect x="985" y="270" width="100" height="190" rx="14"/></g>
  <g stroke-width="8" stroke-linecap="round"><path d="M135 310h60M135 350h60M135 390h60M260 310h60M260 350h60M260 390h60M385 310h60M385 350h60M385 390h60" stroke="#fda4af"/><path d="M755 310h60M755 350h60M755 390h60M880 310h60M880 350h60M880 390h60M1005 310h60M1005 350h60M1005 390h60" stroke="#5eead4"/></g>
