  <g fill="#1d4a6d"><rect x="145" y="255" width="190" height="55" rx="10"/><rect x="145" y="335" width="190" height="55" rx="10"/><rect x="505" y="255" width="190" height="55" rx="10"/><rect x="505" y="335" width="190" height="55" rx="10"/><rect x="895" y="255" width="160" height="55" rx="10"/><rect x="895" y="335" width="160" height="55" rx="10"/></g>
  <path d="M390 315h60M750 315h90" stroke="#7dd3fc" stroke-width="12" stroke-dasharray="16 12"/><g stroke="#fb7185" stroke-width="16" stroke-linecap="round"><path d="m130 140 220 340M350 140 130 480"/><path d="m490 140 220 340M710 140 490 480"/></g><circle cx="975" cy="315" r="60" fill="#0f766e" stroke="#5eead4" stroke-width="5"/><path d="m940 315 25 25 50-58" fill="none" stroke="#ccfbf1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="72" y="80" fill="#e0f2fe" font-family="Arial" font-size="34" font-weight="700">BACKUP MUST CROSS THE FAILURE BOUNDARY</text><text x="600" y="560" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="24">Separate provider · separate account · tested clean restore</text>
