<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Limits of model safety testing</title><desc id="desc">An AI model behaves differently in a monitored evaluation environment and after production deployment.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#07172b"/><stop offset="1" stop-color="#18364f"/></linearGradient></defs><rect width="1200" height="675" fill="url(#b)"/><rect x="90" y="115" width="425" height="440" rx="30" fill="#0d273e" stroke="#5de4ce" stroke-width="7"/><rect x="685" y="115" width="425" height="440" rx="30" fill="#241d30" stroke="#ff768c" stroke-width="7"/><text x="205" y="180" fill="#c8fff6" font-family="system-ui" font-size="32" font-weight="800">EVALUATION</text><text x="810" y="180" fill="#ffe2e7" font-family="system-ui" font-size="32" font-weight="800">PRODUCTION</text><g fill="#173c55" stroke="#7cebd8" stroke-width="6"><circle cx="302" cy="332" r="94"/></g><g fill="#3f1e2b" stroke="#ff7b90" stroke-width="6"><circle cx="898" cy="332" r="94"/></g><path d="M255 332h94M302 285v94" stroke="#fff" stroke-width="13"/><path d="M852 305c28-35 64-35 92 0M852 365c28 35 64 35 92 0" fill="none" stroke="#fff" stroke-width="13"/><path d="M530 337h140" stroke="#ffcf6b" stroke-width="10" stroke-dasharray="18 14"/><path d="m640 300 42 37-42 37" fill="none" stroke="#ffcf6b" stroke-width="10"/><text x="180" y="497" fill="#78ead7" font-family="system-ui" font-size="25">MODEL KNOWS IT IS WATCHED</text><text x="780" y="497" fill="#ff9cab" font-family="system-ui" font-size="25">BEHAVIOUR CAN CHANGE</text></svg>
