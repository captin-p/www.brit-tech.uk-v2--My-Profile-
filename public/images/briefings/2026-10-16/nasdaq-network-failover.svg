<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Independent network-feed failover</title><desc>Two feeds fail at the same network facility while clients switch to a geographically independent backup.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#153c52"/></linearGradient></defs><rect width="1200" height="630" fill="url(#g)"/><text x="70" y="76" fill="#ecfbff" font-family="system-ui" font-size="34" font-weight="700">NETWORK RESILIENCE · FAILURE DOMAINS</text><rect x="85" y="155" width="355" height="330" rx="30" fill="#11283b" stroke="#ff887d" stroke-width="4"/><text x="160" y="205" fill="#ffd3ce" font-family="system-ui" font-size="27" font-weight="700">CARTERET SITE</text><path d="M155 285h210M155 370h210" stroke="#ff887d" stroke-width="14" stroke-linecap="round"/><circle cx="170" cy="285" r="24" fill="#ef6258"/><circle cx="170" cy="370" r="24" fill="#ef6258"/><path d="m153 268 34 34m0-34-34 34m0 51 34 34m0-34-34 34" stroke="white" stroke-width="7"/><text x="215" y="294" fill="#fff" font-family="system-ui" font-size="25">PRIMARY A</text><text x="215" y="379" fill="#fff" font-family="system-ui" font-size="25">SECONDARY B</text><path d="M465 320h200" stroke="#f7c95f" stroke-width="10" stroke-dasharray="20 14"/><path d="m635 291 40 29-40 29" fill="none" stroke="#f7c95f" stroke-width="10"/><rect x="700" y="155" width="400" height="330" rx="30" fill="#0d3441" stroke="#52ddc8" stroke-width="4"/><text x="795" y="205" fill="#aafff1" font-family="system-ui" font-size="27" font-weight="700">CHICAGO BACKUP</text><path d="M780 300h240" stroke="#52ddc8" stroke-width="16" stroke-linecap="round"/><circle cx="795" cy="300" r="26" fill="#14b8a6"/><path d="m780 300 13 13 28-33" fill="none" stroke="white" stroke-width="8"/><path d="M815 385h170" stroke="#64bff0" stroke-width="8" stroke-linecap="round"/><text x="792" y="445" fill="#dffcff" font-family="system-ui" font-