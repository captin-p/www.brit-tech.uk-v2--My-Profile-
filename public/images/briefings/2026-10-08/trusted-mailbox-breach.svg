  <path d="M395 315h170" stroke="#ff8b78" stroke-width="16" stroke-dasharray="22 16"/><rect x="565" y="208" width="160" height="214" rx="25" fill="#193d52" stroke="#ffd166" stroke-width="8"/><path d="m603 316 32 33 55-69" fill="none" stroke="#ffd166" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M725 315h120" stroke="#63d9c7" stroke-width="16"/><g fill="#15384e" stroke="#79d7e3" stroke-width="6"><rect x="845" y="205" width="260" height="220" rx="24"/><rect x="885" y="250" width="180" height="30" rx="7"/><rect x="885" y="310" width="180" height="30" rx="7"/><rect x="885" y="370" width="110" height="25" rx="7"/></g>
  <text x="600" y="105" fill="white" font-family="sans-serif" font-size="51" font-weight="700" text-anchor="middle">TRUSTED DOMAIN ≠ VERIFIED REQUEST</text><text x="600" y="555" fill="#ccecf6" font-family="sans-serif" font-size="29" text-anchor="middle">CALL-BACK • DUAL APPROVAL • AUDIT</text>
</svg>
