<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Fail-closed AI Control Room</title><desc id="desc">A central control service authorizes two AI workloads and stops a third.</desc><rect width="1200" height="675" fill="#07131f"/><rect x="425" y="195" width="350" height="285" rx="42" fill="#102a3b" stroke="#55e6c1" stroke-width="8"/><circle cx="600" cy="330" r="82" fill="#07131f" stroke="#55e6c1" stroke-width="9"/><path d="M565 330l24 24 50-60" fill="none" stroke="#55e6c1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><g font-family="system-ui,sans-serif" font-weight="700" font-size="26" text-anchor="middle"><rect x="85" y="110" width="230" height="100" rx="24" fill="#163a50"/><text x="200" y="170" fill="#dff8ff">JOB 041</text><rect x="85" y="285" width="230" height="100" rx="24" fill="#163a50"/><text x="200" y="345" fill="#dff8ff">JOB 042</text><rect x="85" y="460" width="230" height="100" rx="24" fill="#3b1d2b" stroke="#ff6577" stroke-width="6"/><text x="200" y="520" fill="#ffb4bd">STOPPED</text><rect x="885" y="195" width="230" height="285" rx="30" fill="#102a3b"/><text x="1000" y="285" fill="#dff8ff">INFERENCE</text><text x="1000" y="335" fill="#dff8ff">ENGINE</text><text x="1000" y="405" fill="#55e6c1">FAIL CLOSED</text></g><path d="M315 160h110M315 335h110M315 510h165M775 335h110" stroke="#8eb5c8" stroke-width="8"/><path d="M450 510h-40" stroke="#ff6577" stroke-width="12"/><text x="600" y="585" text-anchor="middle" fill="#eaf7ff" font-family="system-ui,sans-serif" font-size="38" font-weight="700">CENTRAL AUTHORIZATION BEFORE OUTPUT</text></svg>