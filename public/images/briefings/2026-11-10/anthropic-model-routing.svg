<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Risk-aware AI model routing</title><desc id="desc">A SaaS router sends general tasks to a safeguarded model and verified technical work to a gated specialist model.</desc><rect width="1200" height="675" fill="#15121f"/><g font-family="system-ui,sans-serif" font-weight="700" text-anchor="middle"><rect x="80" y="250" width="250" height="175" rx="32" fill="#2a2440" stroke="#bda5ff" stroke-width="7"/><text x="205" y="330" fill="#f4eeff" font-size="29">SAAS TASK</text><text x="205" y="370" fill="#cbbaf5" font-size="23">risk • cost • latency</text><circle cx="545" cy="337" r="105" fill="#352d50" stroke="#ffc66d" stroke-width="8"/><text x="545" y="327" fill="#fff1d6" font-size="27">ROUTE</text><text x="545" y="367" fill="#fff1d6" font-size="27">BY POLICY</text><rect x="790" y="95" width="325" height="190" rx="32" fill="#243549" stroke="#63dfc5" stroke-width="7"/><text x="952" y="175" fill="#e7fbf6" font-size="29">FABLE 5.2</text><text x="952" y="220" fill="#a9dcd1" font-size="22">safeguarded access</text><rect x="790" y="390" width="325" height="190" rx="32" fill="#472d35" stroke="#ff8c78" stroke-width="7"/><text x="952" y="470" fill="#fff0ed" font-size="29">MYTHOS 5.2</text><text x="952" y="515" fill="#f0b3a7" font-size="22">verified access</text></g><path d="M330 337h110M650 295l140-105M650 380l140 105" fill="none" stroke="#bda5ff" stroke-width="9"/><path d="M770 180l20 10-22 6M770 475l20 10-22 6" fill="#bda5ff"/><text x="600" y="620" text-anchor="middle" fill="#f5efff" font-family="system-ui,sans-serif" font-size="34" font-weight="700">USE THE SPECIALIST TIER ONLY WHEN THE JOB EARNS IT</text></svg>