<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Data centre efficiency label</title><desc id="desc">A European data centre is measured for electricity, water and recovered heat.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08251f"/><stop offset="1" stop-color="#184e4d"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(85 120)"><rect width="430" height="350" rx="26" fill="#123c3d" stroke="#78dbc1" stroke-width="5"/><g fill="#071f24" stroke="#9bd9cb" stroke-width="4"><rect x="55" y="48" width="320" height="68" rx="10"/><rect x="55" y="140" width="320" height="68" rx="10"/><rect x="55" y="232" width="320" height="68" rx="10"/></g><g fill="#71e4bd"><circle cx="93" cy="82" r="10"/><circle cx="93" cy="174" r="10"/><circle cx="93" cy="266" r="10"/></g><g stroke="#b8eee0" stroke-width="9" stroke-linecap="round"><path d="M130 82h190"/><path d="M130 174h145"/><path d="M130 266h210"/></g></g>
