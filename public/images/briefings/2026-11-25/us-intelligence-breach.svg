<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Unclassified network breach</title>
<desc id="desc">An unclassified intelligence collection network is isolated while identity and network evidence is reviewed.</desc>
<defs>
  <radialGradient id="bg" cx="50%" cy="35%" r="85%">
    <stop offset="0%" stop-color="#173252"/>
    <stop offset="100%" stop-color="#06101d"/>
  </radialGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<path d="M80 145H1120" stroke="#284865" stroke-width="2"/>
<text x="80" y="94" fill="#ffffff" font-family="Arial, sans-serif" font-size="40" font-weight="700">Unclassified network breach</text>
<rect x="120" y="205" width="360" height="245" rx="24" fill="#0d2135" stroke="#355b78" stroke-width="2"/>
<rect x="720" y="205" width="360" height="245" rx="24" fill="#0d2135" stroke="#355b78" stroke-width="2"/>
<text x="160" y="255" fill="#ff6b7a" font-family="Arial, sans-serif" font-size="25" font-weight="700">EXPOSED</text>
<text x="160" y="310" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">Public-source network</text>
<text x="160" y="348" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">Unknown intrusion path</text>
<text x="160" y="386" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">Data scope under review</text>
<text x="760" y="255" fill="#ff6b7a" font-family="Arial, sans-serif" font-size="25" font-weight="700">CONTAIN</text>
<text x="760" y="310" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">Segment collection systems</text>
<text x="760" y="348" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">Review external telemetry</text>
<text x="760" y="386" fill="#d7e8f8" font-family="Arial, sans-serif" font-size="24">Limit cross-zone access</text>
