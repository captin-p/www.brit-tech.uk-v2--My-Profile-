<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">AI prompt URLs crossed the intended data boundary</title><desc id="d">A developer prompt containing a private URL is processed by a security scanner that extracts and later probes the URL even when zero retention is selected.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243d"/><stop offset="1" stop-color="#070f1c"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="72" y="82" fill="#fff" font-family="Arial" font-size="38" font-weight="700">PROMPT DATA CAN CROSS THE PROVIDER BOUNDARY</text><text x="72" y="122" fill="#9fb7ce" font-family="Arial" font-size="22">A zero-retention label does not eliminate every intermediate process</text><rect x="70" y="200" width="285" height="250" rx="22" fill="#132b45" stroke="#60a5fa" stroke-width="2"/><text x="104" y="246" fill="#93c5fd" font-family="Arial" font-size="22" font-weight="700">DEVELOPER PROMPT</text><rect x="104" y="275" width="216" height="70" rx="12" fill="#0b1b2e" stroke="#3b82f6"/><text x="124" y="305" fill="#dbeafe" font-family="monospace" font-size="16">https://private/</text><text x="124" y="329" fill="#fca5a5" font-family="monospace" font-size="16">reset?token=...</text><rect x="104" y="370" width="216" height="40" rx="10" fill="#1e3a5f"/><text x="126" y="397" fill="#bfdbfe" font-family="Arial" font-size="17">ZDR requested</text><path d="M375 325H455" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/><path d="M435 305l22 20-22 20" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/><rect x="475" y="200" width="300" height="250" rx="22" fill="#30251a" stroke="#f59e0b" stroke-width="2"/><text x="510" y="246" fill="#fcd34d" font-family="Arial" font-size="22" font-weight="700">PROVIDER SECURITY SCAN</text><circle cx="625" cy="322" r="55" fill="#78350f" stroke="#fbbf24" stroke-width="3"/><circle cx="625" cy="322" r="26" fill="none" stroke="#fde68a" stroke-width="7"/><path d="M645 342l24 24" stroke="#fde68a" stroke-width="9" stroke-linecap="round"/><text x="510" y="410" fill="#fef3c7" font-family="Arial" font-size="17">URL extracted and logged</text><path d="M795 325H875" stroke="#fb7185" stroke-width="8" stroke-linecap="round"/><path d="M855 305l22 20-22 20" fill="none" stroke="#fb7185" stroke-width="8" stroke-linecap="round"/><rect x="895" y="200" width="235" height="250" rx="22" fill="#321b29" stroke="#fb7185" stroke-width="2"/><text x="930" y="246" fill="#fda4af" font-family="Arial" font-size="22" font-weight="700">LATER ACCESS</text><rect x="955" y="290" width="110" height="82" rx="10" fill="#4c1d2b" stroke="#fb7185" stroke-width="3"/><path d="M977 310l22 20-22 20m57-40-22 20 22 20" fill="none" stroke="#fecdd3" stroke-width="5" stroke-linecap="round"/><text x="930" y="410" fill="#fecdd3" font-family="Arial" font-size="17">Canary URL contacted</text><rect x="70" y="485" width="1060" height="76" rx="18" fill="#102d2a" stroke="#34d399" stroke-width="2"/><text x="106" y="532" fill="#a7f3d0" font-family="Arial" font-size="22" font-weight="700">REDACT SECRETS · USE SYNTHETIC DATA · VERIFY ROUTING · ROTATE EXPOSED TOKENS</text><text x="72" y="620" fill="#7dd3fc" font-family="Arial" font-size="18" letter-spacing="2">BRIT TECH · 27 NOVEMBER 2026</text></svg>