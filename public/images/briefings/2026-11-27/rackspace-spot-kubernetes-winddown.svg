<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Rackspace Spot Kubernetes migration deadline</title><desc id="d">Customer workloads, persistent data and Kubernetes Secrets must move from Rackspace Spot to a replacement cluster before 8 December 2026.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10243b"/><stop offset="1" stop-color="#070f1c"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="72" y="82" fill="#fff" font-family="Arial" font-size="38" font-weight="700">RACKSPACE SPOT: MIGRATE BEFORE SHUTDOWN</text><text x="72" y="122" fill="#9fb7ce" font-family="Arial" font-size="22">Credential exposure plus a fixed service-retirement deadline</text><rect x="80" y="195" width="340" height="270" rx="22" fill="#2a1c2b" stroke="#fb7185" stroke-width="2"/><text x="116" y="238" fill="#fda4af" font-family="Arial" font-size="22" font-weight="700">RACKSPACE SPOT</text><g fill="#17334b" stroke="#60a5fa" stroke-width="2"><rect x="120" y="270" width="74" height="82" rx="10"/><rect x="213" y="270" width="74" height="82" rx="10"/><rect x="306" y="270" width="74" height="82" rx="10"/></g><g fill="#bfdbfe" font-family="Arial" font-size="17" text-anchor="middle"><text x="157" y="317">POD</text><text x="250" y="317">POD</text><text x="343" y="317">POD</text></g><rect x="120" y="375" width="260" height="48" rx="10" fill="#4c1d2b" stroke="#fb7185"/><text x="142" y="406" fill="#fecdd3" font-family="Arial" font-size="19">Secrets potentially exposed</text><path d="M440 330H545" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/><path d="M525 310l22 20-22 20" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/><rect x="565" y="195" width="220" height="270" rx="22" fill="#352b16" stroke="#fbbf24" stroke-width="2"/><text x="603" y="238" fill="#fde68a" font-family="Arial" font-size="22" font-weight="700">MIGRATE</text><circle cx="675" cy="322" r="55" fill="#78350f" stroke="#fbbf24" stroke-width="3"/><path d="M650 322h50m-18-18 18 18-18 18" fill="none" stroke="#fef3c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="595" y="410" fill="#fef3c7" font-family="Arial" font-size="18">Export · rebuild · rotate</text><path d="M805 330H890" stroke="#34d399" stroke-width="8" stroke-linecap="round"/><path d="M870 310l22 20-22 20" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round"/><rect x="910" y="195" width="210" height="270" rx="22" fill="#10362f" stroke="#34d399" stroke-width="2"/><text x="944" y="238" fill="#a7f3d0" font-family="Arial" font-size="22" font-weight="700">NEW CLUSTER</text><g fill="#124e42" stroke="#34d399" stroke-width="2"><rect x="945" y="270" width="58" height="70" rx="9"/><rect x="1018" y="270" width="58" height="70" rx="9"/></g><g fill="#d1fae5" font-family="Arial" font-size="15" text-anchor="middle"><text x="974" y="310">APP</text><text x="1047" y="310">DATA</text></g><text x="944" y="390" fill="#d1fae5" font-family="Arial" font-size="17">Fresh credentials</text><rect x="80" y="500" width="1040" height="68" rx="16" fill="#3b1d27" stroke="#fb7185" stroke-width="2"/><text x="116" y="545" fill="#fecdd3" font-family="Arial" font-size="26" font-weight="700">DEADLINE: 8 DEC 2026 · 17:00 US CENTRAL / 23:00 UTC</text><text x="72" y="620" fill="#7dd3fc" font-family="Arial" font-size="18" letter-spacing="2">BRIT TECH · 27 NOVEMBER 2026</text></svg>