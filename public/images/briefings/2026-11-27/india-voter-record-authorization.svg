<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Broken object-level authorization</title><desc id="d">A predictable callback reference is used to request another person's record; server-side ownership checks block the request.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a43"/><stop offset="1" stop-color="#07111e"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><text x="72" y="82" fill="#fff" font-family="Arial" font-size="38" font-weight="700">BROKEN OBJECT-LEVEL AUTHORIZATION</text><text x="72" y="122" fill="#9fb7ce" font-family="Arial" font-size="22">Predictable IDs are not an access-control mechanism</text><rect x="72" y="190" width="280" height="270" rx="22" fill="#142e46" stroke="#3d607e" stroke-width="2"/><text x="104" y="236" fill="#93c5fd" font-family="Arial" font-size="22" font-weight="700">BROWSER REQUEST</text><text x="104" y="292" fill="#e5eef7" font-family="monospace" font-size="22">GET /records/10482</text><text x="104" y="340" fill="#fca5a5" font-family="Arial" font-size="20">Reference ID guessed</text><text x="104" y="386" fill="#9fb7ce" font-family="Arial" font-size="18">Request asks for another</text><text x="104" y="414" fill="#9fb7ce" font-family="Arial" font-size="18">person's record</text><path d="M370 325H470" stroke="#fb7185" stroke-width="8" stroke-linecap="round"/><path d="M450 305l22 20-22 20" fill="none" stroke="#fb7185" stroke-width="8" stroke-linecap="round"/><rect x="490" y="190" width="300" height="270" rx="22" fill="#142e46" stroke="#fb7185" stroke-width="2"/><text x="526" y="236" fill="#fda4af" font-family="Arial" font-size="22" font-weight="700">SERVER CHECK</text><rect x="526" y="270" width="228" height="54" rx="12" fill="#3b1826"/><text x="544" y="305" fill="#fecdd3" font-family="Arial" font-size="19">Verify record owner</text><rect x="526" y="386" width="228" height="48" rx="12" fill="#064e3b"/><text x="548" y="417" fill="#a7f3d0" font-family="Arial" font-size="19" font-weight="700">DENY cross-user read</text><path d="M810 325H900" stroke="#34d399" stroke-width="8" stroke-linecap="round"/><path d="M880 305l22 20-22 20" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round"/><rect x="920" y="190" width="208" height="270" rx="22" fill="#0e352f" stroke="#34d399" stroke-width="2"/><text x="954" y="236" fill="#a7f3d0" font-family="Arial" font-size="22" font-weight="700">SAFE</text><path d="M1024 282l50 20v46c0 43-24 68-50 82-26-14-50-39-50-82v-46z" fill="#14532d" stroke="#34d399" stroke-width="4"/><path d="M1000 351l18 18 34-42" fill="none" stroke="#bbf7d0" stroke-width="7" stroke-linecap="round"/><text x="72" y="565" fill="#cbd5e1" font-family="Arial" font-size="24">Every record read and file download needs a server-side ownership check.</text><text x="72" y="620" fill="#7dd3fc" font-family="Arial" font-size="18" letter-spacing="2">BRIT TECH · 27 NOVEMBER 2026</text></svg>