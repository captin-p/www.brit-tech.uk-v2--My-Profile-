<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Tailscale SSH and Unix socket boundary</title><desc id="d">An authenticated overlay peer is prevented from forwarding traffic into root-only Docker and daemon sockets.</desc><defs><linearGradient id="g" x2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient><filter id="s"><feDropShadow dy="12" stdDeviation="15" flood-opacity=".35"/></filter></defs><rect width="1200" height="630" fill="url(#g)"/><circle cx="180" cy="285" r="105" fill="#dbeafe" filter="url(#s)"/><circle cx="180" cy="255" r="34" fill="#2563eb"/><path d="M115 355c12-62 118-62 130 0z" fill="#2563eb"/><path d="M285 285h245" stroke="#60a5fa" stroke-width="20" stroke-linecap="round" stroke-dasharray="26 18"/><rect x="505" y="125" width="85" height="320" rx="32" fill="#fbbf24"/><path d="M530 210l35 35m0-35l-35 35M530 325l35 35m0-35l-35 35" stroke="#78350f" stroke-width="12" stroke-linecap="round"/><rect x="675" y="135" width="410" height="300" rx="34" fill="#fff" filter="url(#s)"/><g fill="#1d4ed8"><rect x="745" y="200" width="120" height="90" rx="20"/><rect x="895" y="200" width="120" height="90" rx="20"/></g><path d="M780 245h50M930 245h50" stroke="#bfdbfe" stroke-width="15" stroke-linecap="round"/><path d="M745 345h270" stroke="#93c5fd" stroke-width="18" stroke-linecap="round"/><text x="70" y="550" fill="#fff" font-family="system-ui,sans-serif" font-size="31" font-weight="700">OVERLAY ACCESS ≠ ROOT SOCKET ACCESS</text></svg>