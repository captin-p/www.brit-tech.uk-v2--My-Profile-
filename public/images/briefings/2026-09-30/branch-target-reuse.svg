<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Branch Target Reuse attack</title><desc id="desc">A stale processor branch target redirects speculative execution from a JIT cache toward protected memory.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06172b"/><stop offset="1" stop-color="#15374e"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><g stroke="#55dfc7" opacity=".18"><path d="M70 130h1060M70 545h1060M210 70v535M600 70v535M990 70v535"/></g><rect x="95" y="180" width="325" height="310" rx="28" fill="#0b263d" stroke="#64e5cf" stroke-width="7"/><text x="195" y="245" fill="#c9fff6" font-family="system-ui" font-size="34" font-weight="800">JIT CACHE</text><g fill="#183e57"><rect x="150" y="290" width="215" height="48" rx="8"/><rect x="150" y="365" width="215" height="48" rx="8"/></g><path d="M420 330h275" stroke="#ffcf6b" stroke-width="11" stroke-dasharray="22 14"/><path d="m660 291 46 39-46 39" fill="none" stroke="#ffcf6b" stroke-width="11"/><rect x="720" y="180" width="385" height="310" rx="28" fill="#301d29" stroke="#ff7288" stroke-width="7"/><path d="M875 242l84 46v94l-84 48-84-48v-94z" fill="#4a2431" stroke="#fff" stroke-width="6"/><path d="M839 337h72" stroke="#fff" stroke-width="12"/><text x="800" y="460" fill="#ffdfe5" font-family="system-ui" font-size="29" font-weight="800">PROTECTED MEMORY</text><text x="463" y="302" fill="#ffe9a8" font-family="system-ui" font-size="24">STALE TARGET</text></svg>
