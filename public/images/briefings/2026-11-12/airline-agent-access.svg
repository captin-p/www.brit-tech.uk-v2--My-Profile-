<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Scoped airline access for AI agents</title><desc id="desc">A third-party AI agent is stopped at an airline account gateway until scoped authorization and human confirmation are present.</desc><rect width="1200" height="675" fill="#071724"/><rect x="90" y="180" width="300" height="310" rx="32" fill="#283052" stroke="#aaa8ff" stroke-width="8"/><circle cx="240" cy="285" r="65" fill="#aaa8ff"/><text x="240" y="420" text-anchor="middle" fill="#f4f2ff" font-family="system-ui,sans-serif" font-size="28" font-weight="750">AI TRAVEL AGENT</text><path d="M390 335h155" stroke="#ff6f80" stroke-width="14"/><rect x="525" y="150" width="45" height="370" rx="22" fill="#ffca67"/><circle cx="548" cy="335" r="62" fill="#3b2830" stroke="#fff0c7" stroke-width="8"/><path d="M520 335h56" stroke="#fff0c7" stroke-width="14" stroke-linecap="round"/><path d="M570 335h115" stroke="#75a0b6" stroke-width="10"/><path d="M685 260l90 75-90 75z" fill="#75a0b6"/><path d="M775 335h120" stroke="#75a0b6" stroke-width="10"/><path d="M900 305c70-60 140-15 175 20-35 30-105 75-175 18z" fill="#64dbc5"/><text x="890" y="465" text-anchor="middle" fill="#dffff8" font-family="system-ui,sans-serif" font-size="23">SCOPED TOKEN + HUMAN CONFIRMATION</text><text x="600" y="610" text-anchor="middle" fill="#effaff" font-family="system-ui,sans-serif" font-size="36" font-weight="700">DO NOT HAND AN AGENT THE USER'S SESSION</text></svg>