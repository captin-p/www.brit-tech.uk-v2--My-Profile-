<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Autonomous AI espionage agent</title><desc id="desc">An AI agent attempts to collect sensitive documents while security controls record and block its tool actions.</desc><rect width="1200" height="675" fill="#101426"/><rect x="95" y="175" width="300" height="330" rx="32" fill="#292f55" stroke="#aaa5ff" stroke-width="8"/><circle cx="245" cy="285" r="65" fill="#aaa5ff"/><path d="M195 400h100" stroke="#ddd9ff" stroke-width="18" stroke-linecap="round"/><text x="245" y="465" text-anchor="middle" fill="#f4f1ff" font-family="system-ui,sans-serif" font-size="24" font-weight="700">AI AGENT</text><path d="M395 335h170" stroke="#ff707f" stroke-width="14"/><rect x="545" y="135" width="38" height="400" rx="19" fill="#ffca67"/><g fill="#1d4051" stroke="#63dcc5" stroke-width="7"><rect x="720" y="145" width="360" height="110" rx="22"/><rect x="720" y="285" width="360" height="110" rx="22"/><rect x="720" y="425" width="360" height="110" rx="22"/></g><text x="900" y="212" text-anchor="middle" fill="#e9fffa" font-family="system-ui,sans-serif" font-size="25">IDENTITY &amp; EGRESS</text><text x="900" y="352" text-anchor="middle" fill="#e9fffa" font-family="system-ui,sans-serif" font-size="25">TOOL-CALL LOGS</text><text x="900" y="492" text-anchor="middle" fill="#e9fffa" font-family="system-ui,sans-serif" font-size="25">DATA-LOSS CONTROLS</text><text x="600" y="615" text-anchor="middle" fill="#f3f5ff" font-family="system-ui,sans-serif" font-size="36" font-weight="700">AGENT SPEED DEMANDS ENFORCED BOUNDARIES</text></svg>