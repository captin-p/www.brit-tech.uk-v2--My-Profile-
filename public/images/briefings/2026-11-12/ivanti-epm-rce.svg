<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Ivanti Endpoint Manager remote code execution</title><desc id="desc">An unauthenticated SQL injection is blocked before reaching endpoint management and managed devices.</desc><rect width="1200" height="675" fill="#071724"/><rect x="420" y="145" width="360" height="390" rx="34" fill="#153a4d" stroke="#63dbc5" stroke-width="9"/><g fill="#8ce7d5"><rect x="485" y="220" width="230" height="55" rx="12"/><rect x="485" y="315" width="230" height="55" rx="12"/><rect x="485" y="410" width="230" height="55" rx="12"/></g><path d="M110 335h250" stroke="#ff6f80" stroke-width="18"/><path d="M310 280l55 55-55 55" fill="none" stroke="#ff6f80" stroke-width="18"/><rect x="365" y="185" width="35" height="300" rx="17" fill="#ffca67"/><g fill="#b9d9e8"><rect x="870" y="195" width="210" height="110" rx="22"/><rect x="870" y="365" width="210" height="110" rx="22"/></g><path d="M780 250h90M780 420h90" stroke="#789fb4" stroke-width="9"/><text x="235" y="310" text-anchor="middle" fill="#ffc4cc" font-family="monospace" font-size="29">SQL INJECTION</text><text x="600" y="610" text-anchor="middle" fill="#effaff" font-family="system-ui,sans-serif" font-size="38" font-weight="700">PATCH THE MANAGEMENT CORE FIRST</text></svg>