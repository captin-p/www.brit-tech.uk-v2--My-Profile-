<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Zero-click spyware delivered through advertising</title><desc>A targeted online advertisement silently delivers spyware to a device without a user click.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#164e63"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="80" fill="#f8fafc" font-family="system-ui" font-size="35" font-weight="700">TARGETED AD · ZERO-CLICK DELIVERY</text><rect x="95" y="150" width="380" height="310" rx="28" fill="#f8fafc"/><rect x="130" y="190" width="310" height="105" rx="16" fill="#f59e0b"/><text x="205" y="258" fill="#3b2200" font-family="system-ui" font-size="34" font-weight="800">AD SLOT</text><path d="M150 345h270M150 390h190" stroke="#94a3b8" stroke-width="16" stroke-linecap="round"/><path d="M490 305h210" stroke="#fb7185" stroke-width="10" stroke-dasharray="14 14"/><path d="m670 278 40 27-40 27" fill="none" stroke="#fb7185" stroke-width="10"/><rect x="740" y="135" width="330" height="390" rx="36" fill="#111827" stroke="#38bdf8" stroke-width="5"/><rect x="780" y="185" width="250" height="270" rx="18" fill="#0c4a6e"/><circle cx="905" cy="320" r="72" fill="#be123c"/><path d="M870 285l70 70M940 285l-70 70" stroke="#fff1f2" stroke-width="13"/><text x="765" y="490" fill="#e0f2fe" font-family="system-ui" font-size="26" font-weight="700">NO USER CLICK</text><text x="70" y="575" fill="#a5f3fc" font-family="system-ui" font-size="25">AD RENDER → SELECTIVE SCRIPT → SPYWARE</text></svg>
