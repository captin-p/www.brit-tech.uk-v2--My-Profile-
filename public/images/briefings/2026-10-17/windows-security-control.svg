<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Windows security-control regression</title><desc>A Windows security update leaves the Smart App Control switch unavailable while administrators verify policy state.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c4a6e"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><text x="70" y="80" fill="#f8fafc" font-family="system-ui" font-size="35" font-weight="700">WINDOWS UPDATE · VERIFY CONTROL STATE</text><rect x="90" y="145" width="470" height="360" rx="32" fill="#e0f2fe"/><path d="M150 210h145v110H150zM315 210h145v110H315zM150 340h145v110H150zM315 340h145v110H315z" fill="#0284c7"/><path d="M580 320h120" stroke="#fbbf24" stroke-width="12" stroke-dasharray="18 14"/><rect x="720" y="190" width="390" height="260" rx="90" fill="#334155" stroke="#94a3b8" stroke-width="5"/><circle cx="830" cy="320" r="82" fill="#64748b"/><path d="M795 285l70 70M865 285l-70 70" stroke="#e2e8f0" stroke-width="14"/><text x="920" y="332" fill="#cbd5e1" font-family="system-ui" font-size="30" font-weight="700">UNAVAILABLE</text><text x="70" y="565" fill="#bae6fd" font-family="system-ui" font-size="25">PATCH STATUS ≠ SECURITY STATE</text></svg>
