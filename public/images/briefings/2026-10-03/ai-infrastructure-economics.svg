<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">AI infrastructure economics</title><desc id="desc">A large AI data-centre build-out is balanced against the new revenue required to finance it.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#06172b"/><stop offset="1" stop-color="#332342"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><path d="M130 500h940" stroke="#6be0cd" stroke-width="12"/><path d="M600 145v355" stroke="#ffca68" stroke-width="13"/><path d="M255 245h250l-45 220H300zM695 300h250l-45 165H740z" fill="#132d46" stroke="#7ce5d4" stroke-width="7"/><g fill="#dffff8" font-family="system-ui" font-weight="900"><text x="307" y="355" font-size="60">$30T</text><text x="740" y="385" font-size="52">$4.2T</text></g><g fill="#ffca68" font-family="system-ui" font-size="25" font-weight="800"><text x="275" y="420">BUILD-OUT TO 2050</text><text x="720" y="430">NEW REVENUE / 5 YEARS</text></g><circle cx="600" cy="145" r="45" fill="#ffca68"/><path d="M600 105v80M560 145h80" stroke="#332342" stroke-width="11"/><text x="375" y="585" fill="#eee5ff" font-family="system-ui" font-size="34" font-weight="800">CAPACITY MUST MEET SUSTAINABLE DEMAND</text></svg>
