<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">RETN U.S. network-service transition</title><desc id="desc">A wholesale backbone path is rerouted from a provider link to two alternate carriers, with customer-notice and January 2027 service deadlines.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1d32"/><stop offset="1" stop-color="#1b3d5c"/></linearGradient></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><text x="72" y="78" fill="#a9d3e8" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">NETWORK INFRASTRUCTURE • SUPPLY-CHAIN RISK</text><text x="72" y="140" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Provider dependency becomes a migration deadline</text>
<rect x="90" y="215" width="270" height="210" rx="20" fill="#402b37" stroke="#e47d87" stroke-width="2"/><text x="225" y="268" text-anchor="middle" fill="#ffc4c9" font-family="Arial,sans-serif" font-size="18">CURRENT PROVIDER</text><text x="225" y="321" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="34" font-weight="700">RETN</text><text x="225" y="366" text-anchor="middle" fill="#ffdce0" font-family="Arial,sans-serif" font-size="18">Covered U.S. services</text><path d="M130 390H320" stroke="#e47d87" stroke-width="5" stroke-dasharray="12 10"/>
<path d="M360 320H520" stroke="#e47d87" stroke-width="5" stroke-dasharray="12 10"/><path d="M495 294L525 320L495 346" fill="none" stroke="#e47d87" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="550" y="215" width="560" height="210" rx="20" fill="#102d48" stroke="#5cc7bd" stroke-width="2"/><text x="830" y="260" text-anchor="middle" fill="#8ee0d7" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">ALTERNATE ROUTES</text><rect x="610" y="294" width="190" height="80" rx="14" fill="#1e5a71"/><text x="705" y="326" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18">Carrier A</text><text x="705" y="354" text-anchor="middle" fill="#c6eaf3" font-family="Arial,sans-serif" font-size="16">Transit / peering</text><rect x="860" y="294" width="190" height="80" rx="14" fill="#1e5a71"/><text x="955" y="326" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18">Carrier B</text><text x="955" y="354" text-anchor="middle" fill="#c6eaf3" font-family="Arial,sans-serif" font-size="16">Physical diversity</text>
<rect x="90" y="475" width="1020" height="130" rx="18" fill="#122b43" stroke="#426e8e"/><text x="130" y="520" fill="#ffce7c" font-family="Arial,sans-serif" font-size="22" font-weight="700">2 DEC 2026</text><text x="130" y="554" fill="#c2d9e9" font-family="Arial,sans-serif" font-size="17">U.S. customer notice</text><path d="M490 496V578" stroke="#466b89" stroke-width="2"/><text x="550" y="520" fill="#ffce7c" font-family="Arial,sans-serif" font-size="22" font-weight="700">1 JAN 2027</text><text x="550" y="554" fill="#c2d9e9" font-family="Arial,sans-serif" font-size="17">Covered services end; equipment removed</text>
</svg>