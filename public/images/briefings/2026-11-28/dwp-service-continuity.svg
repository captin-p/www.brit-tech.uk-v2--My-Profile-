<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Public-service incident response and continuity</title><desc id="desc">A government service dashboard is partially isolated while separate status communications, backups and recovery systems remain available.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12233c"/><stop offset="1" stop-color="#2d4e70"/></linearGradient></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><text x="72" y="78" fill="#b3d3eb" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">PUBLIC-SECTOR RESILIENCE</text><text x="72" y="140" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="700">Contain the incident. Keep other services moving.</text>
<rect x="90" y="210" width="610" height="330" rx="20" fill="#f4f7fa"/><rect x="90" y="210" width="610" height="60" rx="20" fill="#dce7ef"/><text x="125" y="249" fill="#183750" font-family="Arial,sans-serif" font-size="21" font-weight="700">CITIZEN SERVICES</text>
<g font-family="Arial,sans-serif"><rect x="128" y="300" width="240" height="88" rx="12" fill="#f5dede" stroke="#d16b75"/><text x="152" y="335" fill="#8c3440" font-size="18">Benefits portal</text><text x="152" y="366" fill="#8c3440" font-size="24" font-weight="700">ISOLATED</text><rect x="395" y="300" width="260" height="88" rx="12" fill="#e1f0e9" stroke="#64a889"/><text x="420" y="335" fill="#2f7159" font-size="18">Appointments</text><text x="420" y="366" fill="#2f7159" font-size="24" font-weight="700">AVAILABLE</text><rect x="128" y="410" width="527" height="88" rx="12" fill="#e5edf4" stroke="#8aa9c1"/><text x="152" y="446" fill="#31516d" font-size="18">Out-of-band status + recovery channel</text><text x="152" y="477" fill="#31516d" font-size="23" font-weight="700">INDEPENDENT OF AFFECTED APP</text></g>
<rect x="755" y="210" width="355" height="330" rx="20" fill="#102b45" stroke="#65b7c5" stroke-width="2"/><circle cx="932" cy="300" r="50" fill="#1f6574"/><path d="M932 266V303L959 321" stroke="#d9f6f1" stroke-width="8" fill="none" stroke-linecap="round"/><text x="932" y="388" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700">RECOVERY</text><text x="932" y="426" text-anchor="middle" fill="#b4d8e9" font-family="Arial,sans-serif" font-size="18">Known-good backups</text><text x="932" y="458" text-anchor="middle" fill="#b4d8e9" font-family="Arial,sans-serif" font-size="18">Separate staff comms</text><text x="932" y="490" text-anchor="middle" fill="#b4d8e9" font-family="Arial,sans-serif" font-size="18">Service-by-service restore</text>
<text x="92" y="604" fill="#b4d8e9" font-family="Arial,sans-serif" font-size="20">A service outage is not, by itself, proof of personal-data compromise.</text>
</svg>