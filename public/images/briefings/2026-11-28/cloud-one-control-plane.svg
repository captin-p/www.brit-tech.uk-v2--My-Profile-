<text x="72" y="76" fill="#a8d6e7" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">CLOUD SECURITY • CONTROL PLANE</text>
<text x="72" y="135" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">One management layer. Many workloads.</text>
