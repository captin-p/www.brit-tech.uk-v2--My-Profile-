<text x="130" y="250" fill="#70d8d4" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">CENTRAL CLOUD ONE CONTROL PLANE</text>
<text x="130" y="294" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Privileged identity • policy • deployment • orchestration</text>
