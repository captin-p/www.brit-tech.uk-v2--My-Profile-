<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Probability-based AI decision workflow</title><desc id="desc">Documents and images enter a compact AI decision model, which returns ranked probability scores and routes uncertain cases to human review.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c36"/><stop offset="1" stop-color="#354b78"/></linearGradient><linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5d74c9"/><stop offset="1" stop-color="#3d9f9d"/></linearGradient></defs>
<rect width="1200" height="675" rx="30" fill="url(#bg)"/><text x="72" y="78" fill="#b9c9f1" font-family="Arial,sans-serif" font-size="22" letter-spacing="4">ARTIFICIAL INTELLIGENCE • DECISION MODELS</text><text x="72" y="140" fill="#fff" font-family="Arial,sans-serif" font-size="44" font-weight="700">From documents to calibrated decisions</text>
<rect x="85" y="230" width="235" height="260" rx="20" fill="#f2f5fa"/><text x="202" y="273" text-anchor="middle" fill="#263f65" font-family="Arial,sans-serif" font-size="20" font-weight="700">INPUTS</text><rect x="125" y="305" width="155" height="62" rx="10" fill="#dce6f3"/><path d="M147 322H258M147 340H245M147 354H225" stroke="#6b87aa" stroke-width="5" stroke-linecap="round"/><text x="202" y="397" text-anchor="middle" fill="#355272" font-family="Arial,sans-serif" font-size="17">Invoice / form</text><rect x="125" y="422" width="155" height="42" rx="10" fill="#e6e4f8"/><text x="202" y="449" text-anchor="middle" fill="#4e4a83" font-family="Arial,sans-serif" font-size="17">Image / audio</text>
<path d="M320 360H430" stroke="#91c5e9" stroke-width="6" stroke-linecap="round"/><path d="M405 335L435 360L405 385" fill="none" stroke="#91c5e9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="450" y="230" width="300" height="260" rx="24" fill="url(#chip)" stroke="#a4e3df" stroke-width="3"/><rect x="485" y="270" width="230" height="180" rx="18" fill="#183c5d" opacity=".75"/><text x="600" y="325" text-anchor="middle" fill="#b7f2e9" font-family="Arial,sans-serif" font-size="18" letter-spacing="2">DECISION MODEL</text><text x="600" y="373" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">d1.3-ultra</text><text x="600" y="414" text-anchor="middle" fill="#d6e8f5" font-family="Arial,sans-serif" font-size="17">probabilities, not prose</text>
<path d="M750 360H850" stroke="#91c5e9" stroke-width="6" stroke-linecap="round"/><path d="M825 335L855 360L825 385" fill="none" stroke="#91c5e9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="875" y="230" width="240" height="260" rx="20" fill="#122a48" stroke="#7ba8d2" stroke-width="2"/><text x="995" y="273" text-anchor="middle" fill="#c6d9f0" font-family="Arial,sans-serif" font-size="20" font-weight="700">TOP CHOICES</text><g font-family="Arial,sans-serif" font-size="17"><text x="910" y="326" fill="#e7f1fb">Approve</text><rect x="910" y="340" width="170" height="13" rx="6" fill="#294762"/><rect x="910" y="340" width="130" height="13" rx="6" fill="#53c3a6"/><text x="910" y="389" fill="#e7f1fb">Review</text><rect x="910" y="403" width="170" height="13" rx="6" fill="#294762"/><rect x="910" y="403" width="90" height="13" rx="6" fill="#f0c36b"/><text x="910" y="452" fill="#e7f1fb">Reject / unsure</text></g>
<rect x="85" y="545" width="1030" height="62" rx="14" fill="#132a45" stroke="#4f7196"/><text x="120" y="584" fill="#c5d9ef" font-family="Arial,sans-serif" font-size="20">SaaS pattern: set confidence thresholds, route uncertain cases to people, measure calibration.</text>
</svg>